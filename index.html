<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>モモまるラン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-bleed 3D stage, floating HUD chips at the top, one centered card for start / game over. Single bright pastel world in both themes. */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --sky:#ffd9e8;
  --ink:#4a2338;
  --ink-soft:#8a5a72;
  --accent:#ff5c93;
  --accent-deep:#d93a72;
  --leaf:#3f9c5a;
  --card:#fff8fb;
  --chip:rgba(255,248,251,.88);
  --star:#ffc93c;
  --font-display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --font-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{font-size:14px}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;
  padding-top:calc(12px + env(safe-area-inset-top, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.chip{background:var(--chip);border-radius:999px;padding:6px 14px;font-weight:800;font-variant-numeric:tabular-nums;font-size:18px;display:flex;align-items:baseline;gap:4px;box-shadow:0 2px 0 rgba(74,35,56,.12)}
.chip small{font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
.chip .st{color:var(--star);-webkit-text-stroke:1px var(--accent-deep);font-size:18px}
.chip.pop{animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.15)}}
.overlay{position:fixed;inset:0;display:grid;place-items:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px;
  background:rgba(255,217,232,.35)}
.card{background:var(--card);border-radius:28px;padding:28px 24px 24px;width:min(360px,100%);text-align:center;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 6px 0 var(--accent-deep),0 18px 40px rgba(217,58,114,.25)}
.card h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,9vw,40px);margin:0;color:var(--accent);line-height:1.1;text-wrap:balance;
  -webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.card h2{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0;color:var(--ink)}
.card p{margin:0;line-height:1.7;color:var(--ink-soft);font-size:14px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:13px;color:var(--ink);background:#ffeef5;border-radius:16px;padding:12px 16px}
.keys b{font-weight:800;color:var(--accent-deep);white-space:nowrap}
.result{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.result div{display:flex;flex-direction:column;gap:2px}
.result span{font-size:11px;letter-spacing:.08em;color:var(--ink-soft)}
.result strong{font-size:22px;font-variant-numeric:tabular-nums}
.newbest{font-family:var(--font-display);color:var(--accent);font-size:15px}
button{font:inherit;font-family:var(--font-display);font-size:20px;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:14px 20px;cursor:pointer;
  box-shadow:0 5px 0 var(--accent-deep);transition:transform .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-deep)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.hud-right{display:flex;gap:8px;align-items:center}
button.sound{pointer-events:auto;font-family:var(--font-body);font-weight:800;font-size:14px;padding:7px 12px;color:var(--ink);background:var(--chip);
  box-shadow:0 2px 0 rgba(74,35,56,.12)}
button.sound:active{transform:translateY(1px);box-shadow:none}
button.sound[aria-pressed="false"]{color:var(--ink-soft);text-decoration:line-through}
.overlay{overflow-y:auto}
.hint{position:fixed;left:0;right:0;bottom:0;text-align:center;pointer-events:none;font-size:12px;color:var(--ink);opacity:.7;
  padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px))}
</style>
</head>
<body>

<div id="stage"></div>

<div class="hud">
  <div class="chip"><span id="dist">0</span><small>m</small></div>
  <div class="hud-right">
    <div class="chip" id="starChip"><span class="st">★</span><span id="stars">0</span></div>
    <button class="sound" id="soundBtn" type="button" aria-pressed="true" aria-label="BGMと効果音">♪ ON</button>
  </div>
</div>
<div class="hint" id="hint" hidden>スワイプで移動・タップでジャンプ　/　← → で移動・スペースでジャンプ</div>

<div class="overlay" id="startPanel">
  <div class="card">
    <h1>モモまるラン</h1>
    <p>桃の子モモまるが、どこまでも続く道をころころ進みます。ブロックをよけて★を集めよう。</p>
    <div class="keys">
      <b>移動</b><span>左右にスワイプ / ← →</span>
      <b>ジャンプ</b><span>タップ・上スワイプ / スペース</span>
      <b>注意</b><span>木箱と丸太はジャンプ、大きなキノコはよけよう</span>
    </div>
    <button id="startBtn" type="button">はしる！</button>
  </div>
</div>

<div class="overlay" id="overPanel" hidden>
  <div class="card">
    <h2>ぽよん…</h2>
    <div class="result">
      <div><span>きょり</span><strong id="rDist">0</strong></div>
      <div><span>★</span><strong id="rStars">0</strong></div>
      <div><span>スコア</span><strong id="rScore">0</strong></div>
    </div>
    <p id="bestLine">ベスト 0</p>
    <div class="newbest" id="newBest" hidden>ベスト更新！</div>
    <button id="retryBtn" type="button">もういっかい</button>
  </div>
</div>

<div class="overlay" id="pausePanel" hidden>
  <div class="card">
    <h2>ひとやすみ</h2>
    <button id="resumeBtn" type="button">つづける</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);
const LANES = [-2.2, 0, 2.2];
const SKY = 0xffd9e8;

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 28, 75);

const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0xffb8cf, 0.85));
const sun = new THREE.DirectionalLight(0xfff4e8, 0.75);
sun.position.set(4, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, {left:-10, right:10, top:14, bottom:-14, near:1, far:40});
scene.add(sun); scene.add(sun.target);

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w < h ? 72 : 60;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// ---------- materials ----------
const M = (color, extra={}) => new THREE.MeshStandardMaterial(Object.assign({color, roughness:.85, metalness:0}, extra));
const matPathA = M(0xfff1dc), matPathB = M(0xffe6cc), matGrass = M(0xa8df8e), matGrassB = M(0x9cd682);
const matLine = M(0xffc2d6);
const matBlock = M(0x8c7cf0), matTall = M(0xff7aa2), matBar = M(0x6cc4e8);
const matTrunk = M(0xb07a55), matTree = M(0x5fbf72), matPuff = M(0xffffff), matCandy = M(0xffa9c6);
const matStar = M(0xffc93c, {emissive:0xffa500, emissiveIntensity:.35, roughness:.4});

// ---------- ground segments ----------
const SEG_LEN = 20, SEG_COUNT = 6;
const segments = [];
for (let i = 0; i < SEG_COUNT; i++){
  const g = new THREE.Group();
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(60, SEG_LEN), i % 2 ? matGrass : matGrassB);
  grass.rotation.x = -Math.PI/2; grass.position.y = -0.02; grass.receiveShadow = true; g.add(grass);
  const path = new THREE.Mesh(new THREE.PlaneGeometry(7.4, SEG_LEN), i % 2 ? matPathA : matPathB);
  path.rotation.x = -Math.PI/2; path.receiveShadow = true; g.add(path);
  [-1.1, 1.1].forEach(x => {
    for (let k = 0; k < 4; k++){
      const d = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 2.4), matLine);
      d.rotation.x = -Math.PI/2; d.position.set(x, 0.01, -SEG_LEN/2 + 2.5 + k*5); g.add(d);
    }
  });
  g.position.z = -i * SEG_LEN;
  scene.add(g); segments.push(g);
}

// ---------- scenery ----------
const scenery = [];
function makeTree(){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.18,.24,1.2,8), matTrunk);
  trunk.position.y = .6; g.add(trunk);
  const top = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), Math.random() < .3 ? matCandy : matTree);
  top.position.y = 1.9; top.scale.set(1, .9, 1); g.add(top);
  g.children.forEach(c => c.castShadow = true);
  return g;
}
function makeCloud(){
  const g = new THREE.Group();
  for (let i = 0; i < 3; i++){
    const s = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), matPuff);
    s.position.set(i*1.1 - 1.1, Math.random()*.3, 0); s.scale.setScalar(.8 + Math.random()*.5); g.add(s);
  }
  return g;
}
function placeScenery(o, z){
  const side = Math.random() < .5 ? -1 : 1;
  if (o.userData.kind === 'cloud'){
    o.position.set(side * (10 + Math.random()*20), 9 + Math.random()*6, z);
  } else {
    o.position.set(side * (5.5 + Math.random()*12), 0, z);
    const s = .8 + Math.random()*.7; o.scale.setScalar(s);
  }
}
for (let i = 0; i < 34; i++){
  const o = i < 28 ? makeTree() : makeCloud();
  o.userData.kind = i < 28 ? 'tree' : 'cloud';
  placeScenery(o, -Math.random()*110 + 10);
  scene.add(o); scenery.push(o);
}

// ---------- player: Momomaru (peach) ----------
const player = new THREE.Group();
const body = new THREE.Group(); player.add(body);
(function buildPeach(){
  const geo = new THREE.SphereGeometry(0.62, 36, 28);
  const pos = geo.attributes.position, cols = [];
  const top = new THREE.Color(0xff7fa8), bot = new THREE.Color(0xffd6a6), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++){
    const y = pos.getY(i), x = pos.getX(i), z = pos.getZ(i);
    // a soft heart-ish top dip gives the peach its cleft
    const r = Math.hypot(x, z);
    if (y > 0.35 && Math.abs(x) < 0.12) pos.setY(i, y - (0.12 - Math.abs(x)) * 0.5);
    const t = THREE.MathUtils.clamp((y + 0.62) / 1.24, 0, 1);
    c.copy(bot).lerp(top, Math.pow(t, 0.8)); cols.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();
  const peach = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors:true, roughness:.55}));
  peach.castShadow = true; peach.scale.set(1, .96, 1); body.add(peach);

  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,.22,6), matTrunk);
  stem.position.set(0, .66, 0); stem.rotation.z = .2; body.add(stem);
  const leafGeo = new THREE.SphereGeometry(1, 12, 8);
  const leafMat = M(0x4fb36a, {roughness:.6});
  const leaf1 = new THREE.Mesh(leafGeo, leafMat); leaf1.scale.set(.32,.05,.14); leaf1.position.set(.2,.72,.02); leaf1.rotation.z = .35;
  const leaf2 = new THREE.Mesh(leafGeo, leafMat); leaf2.scale.set(.24,.045,.11); leaf2.position.set(-.15,.7,-.04); leaf2.rotation.set(.2,.5,-.4);
  leaf1.castShadow = leaf2.castShadow = true;
  body.add(leaf1, leaf2); body.userData.leaves = [leaf1, leaf2];

  // face points toward -z (direction of travel); camera mostly sees the back
  const eyeMat = M(0x3a1d2c, {roughness:.3}), hiMat = M(0xffffff, {emissive:0xffffff, emissiveIntensity:.4});
  [-1, 1].forEach(s => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), eyeMat);
    e.scale.set(.06, .09, .04); e.position.set(s*.17, .08, -.58); body.add(e);
    const h = new THREE.Mesh(new THREE.SphereGeometry(1, 6, 4), hiMat);
    h.scale.setScalar(.022); h.position.set(s*.17 + .02, .12, -.615); body.add(h);
  });

  // stick limbs: thin brown arms and legs, white gloves, green sneakers
  const limbMat = M(0x6b3a2a, {roughness:.7});
  const gloveMat = M(0xfffaf3, {roughness:.5});
  const shoeMat = M(0x4fb36a, {roughness:.6}), soleMat = M(0xfff1dc);
  const legGeo = new THREE.CylinderGeometry(.045, .04, .34, 8);
  const armGeo = new THREE.CylinderGeometry(.04, .035, .32, 8);
  const ballGeo = new THREE.SphereGeometry(1, 14, 10);
  const limbs = {};
  [-1, 1].forEach(s => {
    const hip = new THREE.Group(); hip.position.set(s * .2, -.45, 0);
    const leg = new THREE.Mesh(legGeo, limbMat); leg.position.y = -.17; hip.add(leg);
    const shoe = new THREE.Mesh(ballGeo, shoeMat); shoe.scale.set(.12, .085, .19); shoe.position.set(0, -.37, -.05); hip.add(shoe);
    const sole = new THREE.Mesh(ballGeo, soleMat); sole.scale.set(.125, .035, .195); sole.position.set(0, -.42, -.05); hip.add(sole);
    body.add(hip);

    const sh = new THREE.Group(); sh.position.set(s * .55, -.02, 0); sh.rotation.z = s * .85;
    const arm = new THREE.Mesh(armGeo, limbMat); arm.position.y = -.16; sh.add(arm);
    const glove = new THREE.Mesh(ballGeo, gloveMat); glove.scale.setScalar(.095); glove.position.y = -.34; sh.add(glove);
    body.add(sh);

    limbs[s < 0 ? 'legL' : 'legR'] = hip;
    limbs[s < 0 ? 'armL' : 'armR'] = sh;
    [leg, shoe, arm, glove].forEach(m => m.castShadow = true);
  });
  body.userData.limbs = limbs;
})();
const shadowBlob = new THREE.Mesh(new THREE.CircleGeometry(.55, 20), new THREE.MeshBasicMaterial({color:0x4a2338, transparent:true, opacity:.18}));
shadowBlob.rotation.x = -Math.PI/2; shadowBlob.position.y = .015;
scene.add(player); scene.add(shadowBlob);

// ---------- obstacles & stars ----------
const starShape = (() => {
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++){
    const r = i % 2 ? .17 : .4, a = i / 10 * Math.PI * 2 + Math.PI/2;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i ? s.lineTo(x, y) : s.moveTo(x, y);
  }
  return s;
})();
const starGeo = new THREE.ExtrudeGeometry(starShape, {depth:.12, bevelEnabled:true, bevelThickness:.04, bevelSize:.03, bevelSegments:2});
starGeo.center();

function shadowAll(g){ g.traverse(c => { if (c.isMesh){ c.castShadow = true; c.receiveShadow = true; } }); return g; }

// Wooden crate (jump over or dodge)
const CRATE = (() => {
  const g = new THREE.Group();
  const W = 1.5, H = 1.0, D = 1.2, t = .11;
  const wood = M(0xe0a868, {roughness:.9}), frame = M(0x9c5f33, {roughness:.9});
  const core = new THREE.Mesh(new THREE.BoxGeometry(W - .04, H - .04, D - .04), wood);
  core.position.y = H/2; g.add(core);
  // planks lines on the sides
  for (let k = 1; k < 3; k++){
    const ln = new THREE.Mesh(new THREE.BoxGeometry(W - .02, .025, D + .01), frame);
    ln.position.y = H * k / 3; g.add(ln);
  }
  // 12 edge beams
  const beamX = new THREE.BoxGeometry(W + .02, t, t), beamY = new THREE.BoxGeometry(t, H, t), beamZ = new THREE.BoxGeometry(t, t, D + .02);
  [-1, 1].forEach(sx => [-1, 1].forEach(sz => {
    const b = new THREE.Mesh(beamY, frame); b.position.set(sx*(W/2), H/2, sz*(D/2)); g.add(b);
  }));
  [0, H].forEach(y => [-1, 1].forEach(s => {
    const bx = new THREE.Mesh(beamX, frame); bx.position.set(0, y + (y ? -t/2 : t/2), s*(D/2)); g.add(bx);
    const bz = new THREE.Mesh(beamZ, frame); bz.position.set(s*(W/2), y + (y ? -t/2 : t/2), 0); g.add(bz);
  }));
  // diagonal brace on front and back
  const diagLen = Math.hypot(W, H) - .15;
  [-1, 1].forEach(s => {
    const d = new THREE.Mesh(new THREE.BoxGeometry(diagLen, t, t * .8), frame);
    d.position.set(0, H/2, s*(D/2)); d.rotation.z = Math.atan2(H, W) * s; g.add(d);
  });
  return shadowAll(g);
})();

// Giant spotted mushroom (too tall to jump: dodge it)
const MUSHROOM = (() => {
  const g = new THREE.Group();
  const stemMat = M(0xfff1dd, {roughness:.8}), capMat = M(0xe8475f, {roughness:.55}), gillMat = M(0xf3d9bd), dotMat = M(0xffffff, {roughness:.5});
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.38, .52, 2.2, 18), stemMat);
  stem.position.y = 1.1; g.add(stem);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.44, .07, 8, 20), stemMat);
  ring.rotation.x = Math.PI/2; ring.position.y = 1.55; g.add(ring);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(1, 26, 14, 0, Math.PI*2, 0, Math.PI/2), capMat);
  cap.scale.set(1.05, .8, 1.05); cap.position.y = 2.15; g.add(cap);
  const gill = new THREE.Mesh(new THREE.CircleGeometry(1.04, 26), gillMat);
  gill.rotation.x = Math.PI/2; gill.position.y = 2.15; g.add(gill);
  const dotGeo = new THREE.SphereGeometry(1, 10, 6);
  [[0,1.0,.16],[.55,.0,.15],[.55,1.25,.14],[.55,2.5,.15],[.55,3.75,.14],[.55,5.0,.15],[.9,.6,.11],[.9,2.0,.12],[.9,3.3,.11],[.9,4.6,.12],[.9,5.8,.11]].forEach(([phi, th, r]) => {
    const p = new THREE.Vector3(Math.sin(phi)*Math.cos(th), Math.cos(phi), Math.sin(phi)*Math.sin(th));
    const d = new THREE.Mesh(dotGeo, dotMat);
    d.position.set(p.x * 1.05, 2.15 + p.y * .8, p.z * 1.05);
    d.scale.set(r, r * .45, r);
    d.lookAt(d.position.x * 2, (d.position.y - 2.15) * 2 + 2.15, d.position.z * 2);
    d.rotateX(Math.PI/2);
    g.add(d);
  });
  return shadowAll(g);
})();

// Fallen log across all lanes (jump!)
const LOG = (() => {
  const g = new THREE.Group();
  const bark = M(0x7f5236, {roughness:.95}), cut = M(0xeec48e, {roughness:.8}), ringMat = M(0xc79560), moss = M(0x6fbf5c, {roughness:.9});
  const R = .38, L = 7.2;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(R, R, L, 18, 1, true), bark);
  trunk.rotation.z = Math.PI/2; trunk.position.y = R; g.add(trunk);
  // bark ridges
  const ridgeGeo = new THREE.TorusGeometry(R + .005, .035, 6, 18);
  for (let k = -3; k <= 3; k++){
    const r = new THREE.Mesh(ridgeGeo, bark);
    r.rotation.y = Math.PI/2; r.position.set(k * 1.0 + .3, R, 0); g.add(r);
  }
  [-1, 1].forEach(s => {
    const face = new THREE.Mesh(new THREE.CircleGeometry(R, 18), cut);
    face.rotation.y = s * Math.PI/2; face.position.set(s * L/2, R, 0); g.add(face);
    [.24, .12].forEach(rr => {
      const ri = new THREE.Mesh(new THREE.RingGeometry(rr, rr + .025, 18), ringMat);
      ri.rotation.y = s * Math.PI/2; ri.position.set(s * (L/2 + .003), R, 0); g.add(ri);
    });
  });
  // moss tufts and a small branch with leaves
  const tuft = new THREE.SphereGeometry(1, 8, 6);
  [[-2.4, .2], [-.6, -.15], [1.4, .1], [2.9, -.2]].forEach(([x, z]) => {
    const m = new THREE.Mesh(tuft, moss); m.scale.set(.32, .12, .22); m.position.set(x, R * 2 - .02, z); g.add(m);
  });
  const twig = new THREE.Mesh(new THREE.CylinderGeometry(.04, .06, .55, 6), bark);
  twig.position.set(.8, R * 2 + .2, .05); twig.rotation.z = -.5; g.add(twig);
  const lf = new THREE.Mesh(tuft, moss); lf.scale.set(.16, .05, .1); lf.position.set(.95, R * 2 + .45, .05); lf.rotation.z = .4; g.add(lf);
  return shadowAll(g);
})();

let things = [];
function addThing(type, lane, z, y){
  let mesh, hw, hd, h, x = lane == null ? 0 : LANES[lane];
  if (type === 'block'){ mesh = CRATE.clone(); mesh.position.set(x, 0, z); mesh.rotation.y = (Math.random() - .5) * .25; hw=.75; hd=.6; h=1.0; }
  else if (type === 'tall'){ mesh = MUSHROOM.clone(); mesh.position.set(x, 0, z); mesh.rotation.y = Math.random() * Math.PI * 2; hw=.8; hd=.8; h=3.2; }
  else if (type === 'bar'){ mesh = LOG.clone(); mesh.position.set(0, 0, z); hw=3.6; hd=.38; h=.76; x = 0; }
  else { mesh = new THREE.Mesh(starGeo, matStar); mesh.position.set(x, y || 1, z); hw=.5; hd=.5; h=0; }
  scene.add(mesh);
  things.push({type, mesh, x, z, hw, hd, h, alive:true});
}
function spawnRow(z){
  const r = Math.random();
  const lane = Math.floor(Math.random()*3);
  if (r < .38){
    addThing('block', lane, z);
    const other = (lane + 1 + Math.floor(Math.random()*2)) % 3;
    for (let k = 0; k < 3; k++) addThing('star', other, z - k*1.6, .9);
  } else if (r < .68){
    const open = lane;
    [0,1,2].forEach(l => { if (l !== open) addThing('tall', l, z); });
    for (let k = 0; k < 3; k++) addThing('star', open, z + 1.6 - k*1.6, .9);
  } else if (r < .86){
    addThing('bar', null, z);
    addThing('star', lane, z, 2.1);
  } else {
    addThing('tall', lane, z);
    addThing('block', (lane + 1) % 3, z - 5);
    addThing('star', (lane + 2) % 3, z - 2.5, .9);
  }
}

// ---------- sparkles ----------
const sparkGeo = new THREE.SphereGeometry(.07, 6, 4);
let sparks = [];
function burst(p, color){
  for (let i = 0; i < 8; i++){
    const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({color, transparent:true}));
    m.position.copy(p); scene.add(m);
    const a = i / 8 * Math.PI * 2;
    sparks.push({m, v:new THREE.Vector3(Math.cos(a)*3, 2 + Math.random()*2, Math.sin(a)*3), life:.45});
  }
}

// ---------- sound (WebAudio chiptune, original tune) ----------
const Sound = (() => {
  let ctx = null, master = null, music = null, noiseBuf = null, timer = null, nextTime = 0, step = 0, muted = false;
  try { muted = localStorage.getItem('momomaru-mute') === '1'; } catch(e){}
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const _ = null;
  // 8 bars x 8 eighth notes: C - Am - F - G, twice with a lifted second half
  const MEL = [
    72,_,76,79, 76,_,74,72,   69,_,72,76, 74,72,69,_,
    65,69,72,77, 76,_,74,72,  74,_,71,67, 71,74,79,_,
    79,_,76,72, 74,76,79,81,  81,_,79,76, 72,_,74,76,
    77,76,74,72, 69,72,74,77, 79,_,74,_, 71,74,72,_
  ];
  const ROOTS = [48, 45, 41, 43, 48, 45, 41, 43];
  const BASS = [0,_,12,_, 0,7,12,_];

  function ensure(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    if (!ctx){
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = muted ? 0 : .8; master.connect(ctx.destination);
      music = ctx.createGain(); music.gain.value = .65; music.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return true;
  }
  function tone(type, freq, t, dur, vol, dest, slideTo){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest || master);
    o.start(t); o.stop(t + dur + .03);
  }
  function noise(t, dur, vol, type, freq, dest){
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || master);
    s.start(t, Math.random() * .5); s.stop(t + dur + .03);
  }
  const stepDur = () => 60 / (132 + Math.min(32, (state.speed - 12) * 1.8)) / 2;
  function playStep(i, t){
    const sd = stepDur(), bar = i >> 3, b = i & 7;
    const m = MEL[i];
    if (m != null){
      tone('square', mtof(m), t, sd * .95, .055, music);
      tone('square', mtof(m + 12), t, sd * .5, .012, music);
    }
    const bo = BASS[b];
    if (bo != null) tone('triangle', mtof(ROOTS[bar] + bo), t, sd * .9, .16, music);
    if (b === 0 || b === 4) tone('sine', 150, t, .13, .3, music, 45);
    if (b === 2 || b === 6) noise(t, .09, .12, 'bandpass', 1800, music);
    if (b & 1) noise(t, .03, .05, 'highpass', 7000, music);
  }
  function schedule(){
    while (nextTime < ctx.currentTime + .12){ playStep(step, nextTime); nextTime += stepDur(); step = (step + 1) % MEL.length; }
  }
  function stopMusic(){ if (timer){ clearInterval(timer); timer = null; } }
  return {
    startMusic(){ if (!ensure()) return; stopMusic(); step = 0; nextTime = ctx.currentTime + .06; timer = setInterval(schedule, 25); },
    stopMusic,
    jump(){ if (!ctx) return; tone('square', 380, ctx.currentTime, .14, .07, master, 820); },
    star(){ if (!ctx) return; const t = ctx.currentTime; tone('triangle', 1318, t, .08, .14); tone('triangle', 1976, t + .06, .14, .14); },
    crash(){
      if (!ctx) return; const t = ctx.currentTime;
      noise(t, .25, .25, 'lowpass', 900);
      tone('sawtooth', 300, t, .35, .08, master, 70);
      [72, 67, 64, 60].forEach((n, k) => tone('square', mtof(n), t + .35 + k * .14, .16, .06));
    },
    suspend(){ if (ctx && ctx.state === 'running') ctx.suspend().catch(() => {}); },
    resume(){ if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {}); },
    toggle(){
      muted = !muted;
      try { localStorage.setItem('momomaru-mute', muted ? '1' : '0'); } catch(e){}
      if (master) master.gain.setTargetAtTime(muted ? 0 : .8, ctx.currentTime, .02);
      return muted;
    },
    get muted(){ return muted; }
  };
})();
function syncSoundBtn(){
  const b = $('soundBtn');
  b.textContent = Sound.muted ? '♪ OFF' : '♪ ON';
  b.setAttribute('aria-pressed', String(!Sound.muted));
}
$('soundBtn').addEventListener('click', e => { Sound.toggle(); syncSoundBtn(); e.currentTarget.blur(); });
syncSoundBtn();

// ---------- state ----------
const state = {mode:'title', speed:12, lane:1, x:0, y:0, vy:0, z:0, dist:0, stars:0, t:0, nextZ:-40, deadT:0, squash:0};
let best = 0;
try { best = parseInt(localStorage.getItem('momomaru-best') || '0', 10) || 0; } catch(e){}

function reset(){
  things.forEach(o => scene.remove(o.mesh)); things = [];
  sparks.forEach(s => scene.remove(s.m)); sparks = [];
  Object.assign(state, {speed:12, lane:1, x:0, y:0, vy:0, z:0, dist:0, stars:0, t:0, nextZ:-40, deadT:0, squash:0});
  segments.forEach((g, i) => g.position.z = -i * SEG_LEN);
  scenery.forEach(o => placeScenery(o, -Math.random()*110 + 10));
  player.rotation.set(0,0,0);
  updateHud();
}
function start(){
  reset(); state.mode = 'play';
  $('startPanel').hidden = true; $('overPanel').hidden = true; $('pausePanel').hidden = true;
  $('hint').hidden = false;
  Sound.startMusic();
  setTimeout(() => { $('hint').hidden = true; }, 4500);
}
function gameOver(){
  state.mode = 'dying'; state.deadT = 0;
  Sound.stopMusic(); Sound.crash();
  burst(new THREE.Vector3(state.x, state.y + .6, state.z), 0xff7fa8);
}
function showResult(){
  state.mode = 'over';
  const d = Math.floor(state.dist), score = d + state.stars * 20;
  const isBest = score > best;
  if (isBest){ best = score; try { localStorage.setItem('momomaru-best', String(best)); } catch(e){} }
  $('rDist').textContent = d + 'm';
  $('rStars').textContent = state.stars;
  $('rScore').textContent = score;
  $('bestLine').textContent = 'ベスト ' + best;
  $('newBest').hidden = !isBest;
  $('overPanel').hidden = false;
  $('retryBtn').focus();
}
function pause(){ if (state.mode === 'play'){ state.mode = 'paused'; $('pausePanel').hidden = false; Sound.suspend(); } }
function resume(){ if (state.mode === 'paused'){ state.mode = 'play'; $('pausePanel').hidden = true; Sound.resume(); } }

function updateHud(){
  $('dist').textContent = Math.floor(state.dist);
  $('stars').textContent = state.stars;
}
function bumpStars(){
  const c = $('starChip'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
}

// ---------- input ----------
function move(d){ if (state.mode === 'play') state.lane = Math.max(0, Math.min(2, state.lane + d)); }
function jump(){ if (state.mode === 'play' && state.y <= 0.001){ state.vy = 9.2; state.squash = -.25; Sound.jump(); } }

window.addEventListener('keydown', e => {
  const k = e.key;
  if (state.mode === 'play'){
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') move(-1);
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') move(1);
    else if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' ') { jump(); e.preventDefault(); }
    else if (k === 'Escape' || k === 'p' || k === 'P') pause();
  }
  if (k === 'm' || k === 'M'){ Sound.toggle(); syncSoundBtn(); } else if (state.mode === 'paused' && (k === ' ' || k === 'Escape' || k === 'p' || k === 'P')){ resume(); e.preventDefault(); }
});

let ptr = null;
window.addEventListener('pointerdown', e => {
  if (e.target.closest('button') || state.mode !== 'play') return;
  ptr = {x:e.clientX, y:e.clientY, id:e.pointerId};
});
window.addEventListener('pointerup', e => {
  if (!ptr || ptr.id !== e.pointerId) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y; ptr = null;
  if (Math.abs(dx) > 28 && Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1);
  else jump();
});
window.addEventListener('pointercancel', () => ptr = null);

$('startBtn').addEventListener('click', start);
$('retryBtn').addEventListener('click', start);
$('resumeBtn').addEventListener('click', resume);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ---------- loop ----------
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 3.3, 6.5);

function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);
  state.t += dt;
  const playing = state.mode === 'play';

  if (playing){
    state.speed = Math.min(30, state.speed + dt * 0.28);
    state.z -= state.speed * dt;
    state.dist += state.speed * dt;

    // lanes
    const tx = LANES[state.lane];
    state.x += (tx - state.x) * Math.min(1, dt * 14);

    // jump physics
    if (state.y > 0 || state.vy > 0){
      state.vy -= 26 * dt; state.y += state.vy * dt;
      if (state.y <= 0){ state.y = 0; state.vy = 0; state.squash = .3; }
    }

    // spawn ahead
    while (state.nextZ > state.z - 90){
      spawnRow(state.nextZ);
      state.nextZ -= 11 + Math.random() * 5 + state.speed * 0.12;
    }

    // collisions
    for (const o of things){
      if (!o.alive) continue;
      const dz = Math.abs(state.z - o.mesh.position.z);
      if (o.type === 'star'){
        o.mesh.rotation.y += dt * 3;
        if (Math.abs(state.x - o.mesh.position.x) < .8 && dz < .8 && Math.abs(state.y + .8 - o.mesh.position.y) < 1.0){
          o.alive = false; scene.remove(o.mesh); state.stars++; bumpStars(); Sound.star();
          burst(o.mesh.position, 0xffc93c);
        }
      } else if (Math.abs(state.x - o.x) < o.hw + .45 && dz < o.hd + .45 && state.y < o.h - .05){
        gameOver(); break;
      }
    }
    updateHud();
  } else if (state.mode === 'dying'){
    state.deadT += dt;
    player.rotation.x -= dt * 9;
    state.y = Math.max(0, Math.sin(Math.min(state.deadT, .6) / .6 * Math.PI) * 1.4);
    state.z += dt * 3;
    if (state.deadT > .8) showResult();
  } else if (state.mode === 'title'){
    state.z -= dt * 4; // gentle idle drift behind the start card
  }

  // cleanup & recycle
  if (state.mode !== 'paused'){
    things = things.filter(o => {
      if (o.mesh.position.z > state.z + 12){ scene.remove(o.mesh); return false; }
      return o.alive;
    });
    segments.forEach(g => { if (g.position.z - SEG_LEN/2 > state.z + 12) g.position.z -= SEG_COUNT * SEG_LEN; });
    scenery.forEach(o => { if (o.position.z > state.z + 14) placeScenery(o, state.z - 80 - Math.random()*30); });
  }

  // sparkles
  sparks = sparks.filter(s => {
    s.life -= dt; s.v.y -= 9 * dt; s.m.position.addScaledVector(s.v, dt);
    s.m.material.opacity = Math.max(0, s.life / .45);
    if (s.life <= 0){ scene.remove(s.m); return false; }
    return true;
  });

  // player pose
  player.position.set(state.x, state.y, state.z);
  const running = state.mode === 'play' || state.mode === 'title';
  const phase = state.t * (state.mode === 'play' ? state.speed * .55 : 5);
  const grounded = state.y === 0;
  const hop = running && grounded ? Math.abs(Math.sin(phase)) * .08 : 0;
  state.squash *= Math.pow(0.001, dt);
  const sq = state.y > 0 ? -.08 : state.squash * .6;
  body.position.y = .88 + hop;
  const L = body.userData.limbs;
  if (state.mode === 'dying'){
    const f = state.t * 30;
    L.legL.rotation.x = Math.sin(f) * 1.2; L.legR.rotation.x = -Math.sin(f) * 1.2;
    L.armL.rotation.x = Math.cos(f) * 1.4; L.armR.rotation.x = -Math.cos(f) * 1.4;
    L.armL.rotation.z = -2.2; L.armR.rotation.z = 2.2;
  } else if (!grounded){
    L.legL.rotation.x = -.7; L.legR.rotation.x = .35;
    L.armL.rotation.x = 0; L.armR.rotation.x = 0;
    L.armL.rotation.z = -2.3; L.armR.rotation.z = 2.3; // arms up in the air
  } else if (running){
    const sw = Math.sin(phase);
    L.legL.rotation.x = sw * .9; L.legR.rotation.x = -sw * .9;
    L.armL.rotation.x = -sw * 1.0; L.armR.rotation.x = sw * 1.0;
    L.armL.rotation.z = -.85; L.armR.rotation.z = .85;
  }
  body.scale.set(1 + sq * .5, 1 - sq * .6, 1 + sq * .5);
  if (state.mode !== 'dying') body.rotation.z = (LANES[state.lane] - state.x) * -.12;
  body.userData.leaves.forEach((l, i) => l.rotation.x = Math.sin(state.t * 10 + i) * .25);
  shadowBlob.position.set(state.x, .015, state.z);
  const sh = 1 - Math.min(state.y, 2) * .3; shadowBlob.scale.setScalar(sh);
  shadowBlob.material.opacity = .18 * sh;

  // camera behind the back
  camPos.x += (state.x * .55 - camPos.x) * Math.min(1, dt * 5);
  camera.position.set(camPos.x, 3.3 + state.y * .25, state.z + 6.5);
  camera.lookAt(state.x * .7, 1.1 + state.y * .3, state.z - 7);
  sun.position.set(state.x + 4, 12, state.z + 6);
  sun.target.position.set(state.x, 0, state.z - 4);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
updateHud();
requestAnimationFrame(tick);
})();
</script>

</body>
</html>
